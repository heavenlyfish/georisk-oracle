# NeMo Guardrails — GeoRisk Oracle
# Uses Nemotron via NIM (OpenAI-compatible) as the guardrails LLM

models:
  - type: main
    engine: openai
    model: nvidia/llama-3.3-nemotron-super-49b-v1
    parameters:
      base_url: "https://integrate.api.nvidia.com/v1"

instructions:
  - type: general
    content: |
      You are a guardrails validator for GeoRisk Oracle, a geopolitical risk
      analysis agent. You ensure all inputs are genuine geopolitical events
      and all outputs are safe, factual, and appropriate for investors.

rails:
  input:
    flows:
      - check geopolitical relevance
  output:
    flows:
      - check financial safety disclaimer
